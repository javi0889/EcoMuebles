<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto EcoMuebles</title>

    <link rel="stylesheet" href="Contacto.css">

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        emailjs.init({
            publicKey: "6SkR1WMjMF_RoiwKa"
        });
    </script>
</head>

<body>

    <header>

        <!-- LOGO -->
        <div class="logo">
            <img src="Captura de pantalla 2026-05-29 122526.png"
                alt="Logo EcoMuebles"
                class="logo-img">

            <span>EcoMuebles</span>
        </div>

        <!-- MENÚ -->
        <nav>
            <a href="index.html">Inicio</a>
            <a href="galeria.html">Galería</a>
            <a href="Contacto.html">Contacto</a>
        </nav>

    </header>

    <section class="contacto">

        <h1>Contáctanos</h1>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Nombre"
                required>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Correo"
                required>

            <textarea
                id="comentario"
                name="comentario"
                placeholder="Escribe tu comentario"
                required></textarea>

            <button type="submit">
                Enviar
            </button>

        </form>

        <p id="mensaje"></p>

    </section>

    <script>
        document.getElementById("formulario").addEventListener("submit", function (event) {
            event.preventDefault();
            sendMail();
        });

        function sendMail() {
            let params = {
                nombre: document.getElementById("nombre").value,
                correo: document.getElementById("correo").value,
                comentario: document.getElementById("comentario").value
            };

            console.log("Datos enviados:", params);
            emailjs.send(
                "service_iyhgp5a",
                "template_stsfr7q",
                params
            )

            .then(function (response) {

                console.log("Correo enviado:", response);
                document.getElementById("mensaje").innerHTML = "Comentario enviado correctamente.";
                document.getElementById("mensaje").style.color = "green";
                document.getElementById("formulario").reset();

            })

            .catch(function (error) {
                console.error("Error:", error);
                document.getElementById("mensaje").innerHTML ="No fue posible enviar el comentario.";
                document.getElementById("mensaje").style.color = "red";

            });

        }

    </script>

</body>

</html>
